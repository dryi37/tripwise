services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: tripwise
      POSTGRES_USER: tripwise
      POSTGRES_PASSWORD: tripwise
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - tripwise_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tripwise -d tripwise"]
      interval: 5s
      timeout: 5s
      retries: 10
  qdrant:
    image: qdrant/qdrant:v1.15.5
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - tripwise_qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/6333'"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  tripwise_postgres_data:
  tripwise_qdrant_data:
